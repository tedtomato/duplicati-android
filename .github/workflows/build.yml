name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish releases on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 37.0
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[6-9]|build-tools;3[6-9]" | sort -u || true
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repository secret RELEASE_KEYSTORE_BASE64 is not set; see README (Releases and updates)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          read CODE NAME < <(./gradlew -q :app:printVersion | tail -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG does not match versionName $NAME in app/build.gradle.kts"
            exit 1
          fi
          ./gradlew assembleRelease
          mkdir -p dist
          APK="DuplicatiRestore-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          SHA=$(sha256sum "dist/$APK" | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "%s", "apk": "%s", "sha256": "%s"}\n' "$CODE" "$NAME" "$APK" "$SHA" > dist/update.json
          cat dist/update.json
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/update.json
